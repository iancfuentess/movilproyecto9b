<ion-content [scrollY]="true" class="booktrack-content">
  <main class="gestionar-page">

    <header class="page-header">
      <a routerLink="/biblioteca" class="back-link">
        <span aria-hidden="true">←</span>
        Volver a Biblioteca
      </a>

      <div class="header-copy">
        <!-- <span class="eyebrow">ADMINISTRACIÓN</span> -->
        <h1>Agregar usuario</h1>
        <p>Completa los datos del nuevo usuario.</p>
      </div>
    </header>

    <section class="form-card">
      <form (ngSubmit)="agregarUsuario()" #formUsuario="ngForm">

        <div class="form-grid">

          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" type="text" [(ngModel)]="nombre" placeholder="Ej. Ian Castro Fuentes"
              autocomplete="name" required />
          </div>

          <div class="campo">
            <label for="username">Nombre de usuario</label>
            <input id="username" name="username" type="text" [(ngModel)]="username" placeholder="Ej. Ian Fuentes"
              autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>

          <div class="campo">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="correo@ejemplo.com"
              autocomplete="email" autocapitalize="none" required />
          </div>

          <div class="campo">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" [(ngModel)]="password"
              placeholder="Escribe una contraseña" autocomplete="new-password" required />
          </div>

        </div>

        <div class="campo role-field">
          <label for="role_id">Rol del usuario</label>

          <div class="role-options">
            <label class="role-option" [class.selected]="role_id === 3">
              <input type="radio" name="role_id" [value]="3" [(ngModel)]="role_id" />
              <span>Usuario</span>
            </label>

            <label class="role-option" [class.selected]="role_id === 2">
              <input type="radio" name="role_id" [value]="2" [(ngModel)]="role_id" />
              <span>Editor</span>
            </label>

            <label class="role-option" [class.selected]="role_id === 1">
              <input type="radio" name="role_id" [value]="1" [(ngModel)]="role_id" />
              <span>Administrador</span>
            </label>
          </div>
        </div>

        @if (mensaje) {
        <div class="mensaje" role="status">
          {{ mensaje }}
        </div>
        }

        <button type="submit" class="btn-agregar" [disabled]="agregando || formUsuario.invalid">
          @if (agregando) {
          Creando usuario...
          } @else {
          <span aria-hidden="true">＋</span>
          Crear usuario
          }
        </button>

      </form>
    </section>

  </main>
</ion-content>
